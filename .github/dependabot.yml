version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      production:
        dependency-type: production
      dev:
        dependency-type: development
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    open-pull-requests-limit: 10
    ignore:
      # A TypeScript major is a deliberate compiler migration, never a weekly bump (#60, #69).
      # update-types is load-bearing: a bare dependency-name ignores ALL updates for the
      # package, including security updates. Do not "simplify" it away.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # vitest and @vitest/* are held out of every version update, patch and minor included.
      # Dependabot's npm 10.9.2 crashes in arborist's peer loader on this tree whenever a vitest-family
      # candidate is resolved ("Cannot read properties of null (reading 'edgesOut')"), and that fails
      # every group run. Upgrade the family by hand, with the suite green. update-types does not
      # apply to security updates, so a vitest advisory still opens a security-update run. That run
      # can hit the same crash; if it fails, apply the advisory by hand.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
