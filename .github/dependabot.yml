version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # vitest and @vitest/* are one peer family: @vitest/coverage-v8 pins its peer vitest to the
      # same exact version. Grouped so they always move in one PR; a split PR fails npm's ERESOLVE.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      production:
        dependency-type: production
      dev:
        dependency-type: development
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
    open-pull-requests-limit: 10
    ignore:
      # A TypeScript major is a deliberate compiler migration, never a weekly bump (#60, #69).
      # update-types is load-bearing: a bare dependency-name ignores ALL updates for the
      # package, including security updates. Do not "simplify" it away.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
