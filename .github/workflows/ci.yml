name: CI

# Least-privilege default for every job (fork PRs already get a read-only
# token; this shrinks the blast radius on push-to-master runs too).
permissions:
  contents: read

on:
  push:
    # candidate/**: a merge tool's TRUE merge commits of master and a pull request (or of a stack of them),
    # tested before the merge so the tree that lands is a tree whose CI run passed. Graded like a pull request's
    # merge commit; see the `tested-tree` job.
    branches: [master, 'candidate/**']
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # A pull request's runs share a group, so its superseded run is cancelled. Every PUSH run (master or a
  # candidate/** branch) is a group of its own: a group holds one running and ONE pending run, and a newly
  # queued run cancels the pending one whatever cancel-in-progress says, so a shared group for pushes would
  # drop a middle master commit untested whenever three land close together.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-config:
    # Committed agent config (`.claude/`, `.mcp.json`, `.grok/`, `.codex/`, at any depth)
    # runs on every machine that opens a checkout of this repo in an agent. No change may
    # add, edit or remove any that `.github/agent-config-allowlist.json` does not name, a
    # committed Claude Code settings file may hold only permitted keys, and every path a
    # change adds must be one name to every filesystem (scripts/agent-config-guard.mjs). The
    # guard and its allowlist are read from the BASE (.github/agent-config.sh), so a change is
    # never graded by its own rules.
    # - The guard runs FIRST, and nothing the change controls reaches it but this workflow and
    #   its launcher, as with every workflow (`.github/`, which CODEOWNERS names an owner for):
    #   no other code, no file, no configuration, no cache. Only the checkout runs before it.
    #   - No setup step: one that reads the checkout can restore files into it from an
    #     earlier run of the same change (a package manager's cache, whose path the change's
    #     .npmrc sets). The guard runs on the runner's own node.
    #   - The launcher's bytes come from the graded commit's object (git cat-file), never from
    #     the working tree, and the launcher reads the guard and its allowlist the same way.
    #   - The guard's tests, which are the change's, run after it, on node 22, with no
    #     package-manager cache.
    #   scripts/agent-config-guard.test.mjs pins all of this.
    # - What it checks is what will land: a pull request as the merge commit GitHub tests
    #   (`github.sha`), never the branch's head alone; a push, tip to tip.
    # - The name is STABLE, `agent-config`, for a pull request or a push, so that branch
    #   protection can require this check by it (an owner's setting, applied after this
    #   merges). Any other event (a dispatched run, say) is not a change: nothing is checked,
    #   and the job takes another name, so it can never stand in for that check, nor fail.
    # It needs no dependency and no secret, so it runs on a fork's pull request as it is,
    # drafts included.
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'agent-config' || 'agent-config (no change to check)' }}
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The guard, as the base has it, before any code of the change runs
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          launcher=$(mktemp)
          git cat-file blob "$SHA:.github/agent-config.sh" > "$launcher"
          # A candidate/** branch is new (its `before` is all zeros) and holds a TRUE merge commit of master and a
          # pull request: it is graded exactly as that pull request's merge commit, against its first parent.
          case "$REF" in refs/heads/candidate/*) EVENT=pull_request ;; esac
          if [ "$EVENT" = pull_request ]; then
            bash "$launcher" pull_request "$SHA"
          else
            bash "$launcher" push "$BEFORE" "$SHA"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: The guard's own tests, after it
        run: node --test scripts/agent-config-guard.test.mjs

  lint:
    name: lint
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The repository's own biome: a missing one fails, where npx would fetch whatever package
      # owns the name.
      - run: ./node_modules/.bin/biome check .
      # `biome check` passes a file whose remaining fixes are only warnings or infos, and
      # `biome check --write` applies them. So a tree this job accepted could still be rewritten
      # by a later --write (the release formats with one). It must change nothing here.
      - name: biome check --write changes nothing
        run: |
          ./node_modules/.bin/biome check --write .
          git diff --exit-code
      # The tested-tree stamp's verdict and ci.yml's wiring of it (scripts/tested-tree.test.mjs).
      - run: node --test scripts/tested-tree.test.mjs

  typecheck:
    name: typecheck
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, for the timing baseline's check.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run typecheck` = `tsc -b` + the three type-test projects
      # (packages/core, packages/openclaw, packages/openshell), because a bare
      # `tsc -b` never compiles a .test-d.ts. That is what makes the F5
      # TrustedClient type-surface guard (trusted-client-types.test-d.ts) and the
      # pi-ai half of the openclaw host contract (packages/openclaw/tests/
      # contract.test-d.ts) gate every push. The openclaw half of that contract
      # needs a package `npm ci` does not install; it is proven in the
      # `openclaw-contract` job instead.
      # It then typechecks every package's TESTS (#193: tsconfig.tests.json) under
      # a ratchet: errors are frozen per file and code in
      # tsconfig.tests.baseline.json, and a new or grown one fails, as does a
      # fixed one until the baseline is tightened.
      - run: npm run typecheck
      # The ratchet's own comparison logic (scripts/typecheck-tests.test.mts).
      - run: npm run typecheck-tests:test
      # Wall-clock thresholds in tests (sleeps, elapsed-time checks, timeouts) are frozen in
      # timing-thresholds.baseline.json: a new one needs fake timers or a `// timing:` comment
      # stating its bound and the headroom measured on CI.
      - run: npm run timing-thresholds
      # On a pull request, the baseline itself may not grow from the base's (the merge commit's
      # first parent): a check of the baseline against itself would pass an --update. A candidate/**
      # merge commit is checked the same way.
      - name: The timing baseline only shrinks
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/candidate/')
        run: npm run timing-thresholds -- --base HEAD^1
      - run: npm run timing-thresholds:test

  test:
    name: test
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # scan-linear.test.ts runs in the scan-linear job below, not here (see that job).
      - name: Run tests with coverage
        run: npx vitest run --coverage --exclude packages/core/tests/harden/scan-linear.test.ts
      - name: Check coverage thresholds
        run: >-
          npx vitest run --coverage
          --exclude packages/core/tests/harden/scan-linear.test.ts
          --coverage.thresholds.lines=92
          --coverage.thresholds.branches=84
          --coverage.thresholds.functions=90
          --coverage.thresholds.statements=92
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  scan-linear:
    name: scan-linear
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # The detectors' linearity rows: each compares a scan's time on an input twice as long with its
    # time on the input, several minutes of measuring. They run here, beside `test` and without
    # coverage, so the test job does not wait on them. The test job excludes this file, and
    # packages/core/tests/harden/scan-linear-ci.test.ts fails if either side drops it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run packages/core/tests/harden/scan-linear.test.ts

  openclaw-contract:
    name: openclaw-contract
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # The proving ground for the openclaw half of the host contract.
    #
    # openclaw is NOT a dependency of this repo. It is declared as an OPTIONAL
    # PEER of packages/openclaw (the plugin's real relationship to its host), and
    # `npm ci` does not install optional peers — so no other job in this workflow
    # has openclaw on disk, and none of them can prove anything about it. This
    # job installs the pinned version out-of-tree and runs the two gates that
    # need it. A failure here is a real contract drift, so it fails the workflow.
    #
    # The pin lives in exactly one file, sourced below. Never inline the version.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned openclaw host (out-of-tree)
        # --no-save: this install is a test fixture, not a dependency. Verified
        # locally from a clean `npm ci` tree: package.json, packages/*/package.json
        # and package-lock.json all come out BYTE-IDENTICAL, which the next step
        # re-checks rather than trusting.
        # --ignore-scripts: openclaw's tree carries native postinstalls (node-pty
        # and friends) that this job never executes; only its .d.ts files matter.
        #
        # NOT `--package-lock=false`. That flag makes arborist rebuild the ideal
        # tree from scratch instead of the lockfile, and npm 10.9.2 then crashes
        # resolving this repo's peer sets:
        #   TypeError: Cannot read properties of null (reading 'edgesOut')
        #     at #loadPeerSet (@npmcli/arborist/lib/arborist/build-ideal-tree.js)
        # It is a deterministic arborist bug, not an environment quirk — it
        # reproduces on a tree straight out of `npm ci`. `--no-save` alone achieves
        # what the flag was there for.
        run: |
          source packages/openclaw/openclaw-contract.env
          npm install --no-save --ignore-scripts openclaw@"$OPENCLAW_CONTRACT_VERSION"
      - name: Assert the fixture install left no tracked file behind
        # The whole point of an out-of-tree install: if this ever starts rewriting
        # package-lock.json, the pin has silently become a dependency again and
        # this job must say so instead of passing.
        run: git diff --exit-code -- package.json package-lock.json 'packages/*/package.json'
      - name: Build packages/core declarations
        # `usertrust` is a workspace symlink to packages/core, whose package.json
        # points `types` at dist/index.d.ts — a file that does not exist on a fresh
        # runner (dist/ is gitignored). The contract project imports `usertrust`
        # through src/types.ts and src/index.ts, and `tsc -p` — unlike `tsc -b` —
        # does NOT build referenced projects, so without this step the next step
        # fails with `TS2307: Cannot find module 'usertrust'`. That is exactly how
        # this job failed on its first real run (#82, job 93028801034).
        #
        # `tsc -b packages/core` is the same idiom the `typecheck` job gets for free
        # (`npm run typecheck` = `tsc -b && …`, where the leading `tsc -b` is what
        # makes tsconfig.type-tests.json resolve `usertrust` at all), scoped to the
        # one project the contract needs. The `test` job needs no equivalent:
        # vitest.config.ts aliases `usertrust` to packages/core/src, which is why
        # the vitest step below is unaffected.
        run: npx tsc -b packages/core
      - name: Type-level contract vs. the pinned host
        # tsconfig.contract-openclaw.json, not tsconfig.type-tests.json: `tsc` has
        # no way to skip a file whose import cannot resolve, so the openclaw
        # assertions live in their own project and their own .test-d.ts. The pi-ai
        # half stays in tsconfig.type-tests.json, which `npm run typecheck` runs on
        # every push. Between the two, every assertion runs somewhere in CI.
        env:
          USERTRUST_OPENCLAW_CONTRACT: "1"
        run: npx tsc -p packages/openclaw/tsconfig.contract-openclaw.json
      - name: Host smoke test vs. the pinned host
        # USERTRUST_OPENCLAW_CONTRACT=1 makes an absent or version-mismatched
        # openclaw a HARD failure in contract.test.ts. Without it the suite skips
        # itself, which is right everywhere else and worthless here.
        env:
          USERTRUST_OPENCLAW_CONTRACT: "1"
        run: npx vitest run packages/openclaw/tests/contract.test.ts

  tb-integration:
    name: tb-integration
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # Additive job: runs in parallel with lint/typecheck/test and gates none of them
    # (nothing `needs:` it). It stands up a real single-node TigerBeetle cluster and
    # runs the env-gated integration test that the normal `test` job self-skips
    # (USERTRUST_TB_ADDRESS unset there). A failure here is a real hard-budget
    # enforcement failure, so this job is allowed to fail the workflow.
    env:
      # Pin the TigerBeetle server to a version compatible with tigerbeetle-node
      # 0.17.9 in packages/core. The client must never be newer than the server
      # (0.17.9 requires server >= 0.17.5), so pin the server to 0.17.9 and bump
      # this in lockstep whenever tigerbeetle-node is upgraded — never `latest`.
      TIGERBEETLE_VERSION: "0.17.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download TigerBeetle static binary
        # The statically-linked binary avoids the Docker seccomp/io_uring + memlock
        # pitfalls on ubuntu-latest. If this version-pinned release URL is ever
        # unavailable, fall back to the pinned container image instead:
        #   docker run --security-opt seccomp=unconfined --cap-add IPC_LOCK \
        #     -v "$PWD/data:/data" ghcr.io/tigerbeetle/tigerbeetle:${TIGERBEETLE_VERSION} \
        #     format --cluster=0 --replica=0 --replica-count=1 --development /data/0_0.tigerbeetle
        #   docker run -d -p 3000:3000 --security-opt seccomp=unconfined --cap-add IPC_LOCK \
        #     -v "$PWD/data:/data" ghcr.io/tigerbeetle/tigerbeetle:${TIGERBEETLE_VERSION} \
        #     start --addresses=0.0.0.0:3000 --development /data/0_0.tigerbeetle
        run: |
          curl -fsSLo tigerbeetle.zip \
            "https://github.com/tigerbeetle/tigerbeetle/releases/download/${TIGERBEETLE_VERSION}/tigerbeetle-x86_64-linux.zip"
          # Supply-chain pin: verify the exact release asset before executing it.
          # Recompute when bumping TIGERBEETLE_VERSION:
          #   curl -fsSL <url> | shasum -a 256
          echo "af71f2c0057e3b409bf79940fa94894b738187b0d4f1e711097bca15df5d8cd4  tigerbeetle.zip" | sha256sum -c -
          unzip -o tigerbeetle.zip
          chmod +x ./tigerbeetle
          ./tigerbeetle version
      - name: Format TigerBeetle data file
        run: ./tigerbeetle format --cluster=0 --replica=0 --replica-count=1 --development ./0_0.tigerbeetle
      - name: Start TigerBeetle and wait for port 3000
        run: |
          nohup ./tigerbeetle start --addresses=3000 --development ./0_0.tigerbeetle > tigerbeetle.log 2>&1 &
          echo "Waiting for TigerBeetle to accept connections on port 3000..."
          for _ in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3000) 2>/dev/null; then
              echo "TigerBeetle is up."
              exit 0
            fi
            sleep 1
          done
          echo "::error::TigerBeetle did not start within 60s"
          cat tigerbeetle.log || true
          exit 1
      - name: Run TigerBeetle integration tests
        env:
          # The gated tests write this into tigerbeetle.addresses; "3000" resolves to
          # 127.0.0.1:3000, matching the server's --addresses=3000 bind above.
          USERTRUST_TB_ADDRESS: "3000"
          # The binary downloaded above, for the suites that run their OWN cluster on a free port,
          # never the shared one above: `ledger-outage.tb.test.ts` stops and restarts its cluster,
          # `ledger-health.tb.test.ts` stops and restarts its own and evicts sessions from it, and
          # `evicted-client.tb.test.ts` and `evicted-tenant.tb.test.ts` evict sessions from their
          # own (the first fails, rather than skips, when this is unset).
          USERTRUST_TB_BINARY: ${{ github.workspace }}/tigerbeetle
        # Every real-cluster suite in the repo, named explicitly rather than by
        # directory: `packages/openclaw/tests/envelope-integration.test.ts` does not
        # live under any integration/ folder, and a glob over
        # `packages/core/tests/integration/` would have silently kept missing it and
        # `budget-envelope.tb.test.ts`. Each one self-skips when USERTRUST_TB_ADDRESS
        # is unset, which is why the ordinary `test` job never runs them — this job
        # is the only place a hard-budget or envelope-accounting failure can surface.
        # `packages/core/tests/harden/tb-ci-list.test.ts` fails the `test` job if a
        # real-ledger suite on disk is missing from this list, so extend it here.
        run: >-
          npx vitest run
          packages/core/tests/integration/tigerbeetle.tb.test.ts
          packages/core/tests/integration/budget-envelope.tb.test.ts
          packages/core/tests/integration/replay.tb.test.ts
          packages/core/tests/integration/principal-tags.tb.test.ts
          packages/core/tests/integration/authorize-cache-tiers.tb.test.ts
          packages/core/tests/integration/hold-timeout.tb.test.ts
          packages/core/tests/integration/release.tb.test.ts
          packages/core/tests/integration/destroy.tb.test.ts
          packages/core/tests/integration/reconciliation-cache-day.tb.test.ts
          packages/core/tests/integration/job.tb.test.ts
          packages/core/tests/integration/evicted-client.tb.test.ts
          packages/openshell/tests/engine.tb.test.ts
          packages/openclaw/tests/envelope-integration.test.ts
          packages/server/tests/ledger-outage.tb.test.ts
          packages/server/tests/evicted-tenant.tb.test.ts
          packages/server/tests/ledger-health.tb.test.ts

  site-build:
    name: site-build
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    # The site is a standalone npm project outside the workspaces (own lockfile).
    # Evidence fixtures are committed, so this build needs no TigerBeetle and no
    # secrets — public-safe under the workflow-level `contents: read`.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm test
        working-directory: site
      - name: Build (runs the prebuild check-facts gate)
        run: npm run build
        working-directory: site

  # The stamp. A STABLE name, so a re-run supersedes a failure for anything that reads it by name. When every
  # other job of this run passed, it emits ONE annotation, `tested-tree <github.sha>`: the commit this run
  # tested (the merge commit on a pull request, the pushed commit on a push, a candidate/** merge commit
  # included). A merge tool trusts only that annotation, on this check run, from GitHub Actions, in the same
  # check suite as the jobs it judges, and resolves the commit's tree itself. It needs no permission and
  # checks out nothing but the default ref. Skipped for drafts, whose jobs all skip.
  # scripts/tested-tree.test.mjs pins this job, the candidate trigger and folds, and the cancel rule.
  tested-tree:
    name: tested-tree
    needs: [agent-config, lint, typecheck, test, scan-linear, openclaw-contract, tb-integration, site-build]
    if: always() && !cancelled() && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Every job of this run passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          TESTED_SHA: ${{ github.sha }}
          REQUIRED: agent-config lint typecheck test scan-linear openclaw-contract tb-integration site-build
        run: node scripts/tested-tree-verdict.mjs
