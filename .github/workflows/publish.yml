name: Release

# How a release runs, its three modes, how to recover a failed one, and the repository
# settings it relies on: docs/releasing.md. The shell logic lives in scripts/release.sh;
# packages/core/tests/harden/release-workflow.test.ts pins both.
#
# Three jobs, so that dependency code never runs next to a credential that can write:
#   ci-gate  CI passed on the commit, and the npm-publish environment requires a reviewer.
#   build    installs, typechecks, tests, bumps, builds and packs. Read-only token, no OIDC.
#            Two legs of one matrix, on two fresh runners: `release` builds what is
#            published, `rebuild` builds the same commit and bump again, for comparison.
#   publish  approval, then pushes, and publishes tarballs it writes itself from the release
#            commit's files and the build's dist/ bytes, only if the rebuild's dist/ bytes
#            give the same tarballs. Holds the write token, the OIDC token and NPM_TOKEN;
#            installs nothing and runs no dependency code.
#
# No job restores a cache: a cache another workflow's dependency code could have written must
# not reach a release (every setup-node says package-manager-cache: false, and none says cache).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run: every step up to `npm publish --dry-run`; nothing is pushed, published or released"
        required: false
        default: false
        type: boolean
      republish:
        description: "Republish: finish a tagged release whose publish failed (dispatch on the tag v<version>). No bump, commit or tag"
        required: false
        default: false
        type: boolean
      allow_early_major:
        description: "Only for a major less than 90 days after the last one: the reason, which goes into the release notes. Empty otherwise"
        required: false
        default: ""
        type: string

concurrency:
  group: release
  cancel-in-progress: false

# Every job states its own permissions.
permissions: {}

defaults:
  run:
    shell: bash

env:
  # The CI jobs (.github/workflows/ci.yml, as they are named on a push to master) that must
  # all have concluded `success` on the commit being released. To change it, edit this list
  # in the same pull request that adds, renames or removes a job in ci.yml; the
  # release-workflow test fails until the two agree.
  REQUIRED_CI_JOBS: >-
    agent-config
    lint
    typecheck
    test
    scan-linear
    openclaw-contract
    tb-integration
    site-build
  REPUBLISH: ${{ inputs.republish }}

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the CI run's jobs, and the environment's protection rules.
      actions: read
    steps:
      - name: Ensure a releasable ref
        env:
          REF: ${{ github.ref }}
          ALLOW_EARLY_MAJOR: ${{ inputs.allow_early_major }}
        run: |
          # A republish (on a tag or on master) skips the bump check, which is what reads
          # allow_early_major; its reason is already in the release tag.
          if [ "$REPUBLISH" = true ] && [ -n "$ALLOW_EARLY_MAJOR" ]; then
            echo "::error::allow_early_major is for a new major release, not a republish. Clear it."
            exit 1
          fi
          case "$REF" in
            refs/heads/master) ;;
            refs/tags/v*)
              if [ "$REPUBLISH" != true ]; then
                echo "::error::A tag ref is only for republish. Dispatch a new release on master."
                exit 1
              fi
              ;;
            *)
              echo "::error::Releases run on master (or, to republish, on a release tag), not on ${REF}."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The bump is the one the release's CHANGELOG section requires, never the dispatcher's
      # pick: docs/releasing.md, "Choosing the version".
      - name: Require the bump the CHANGELOG requires
        if: ${{ !inputs.republish }}
        env:
          BUMP: ${{ inputs.version }}
          ALLOW_EARLY_MAJOR: ${{ inputs.allow_early_major }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), but this run is for ${GITHUB_SHA}."
            exit 1
          fi
          bash scripts/release.sh assert-bump "$BUMP"

      - name: Require CI success on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), but this run is for ${GITHUB_SHA}."
            exit 1
          fi
          bash scripts/release.sh gate

      # The approval gate is a repository setting. Until the owner has given the environment
      # a required reviewer, every release (dry runs included) is refused here.
      - name: Require an approval on the npm-publish environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh assert-protected npm-publish

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    # Everything that runs dependency code (install scripts, typecheck, tests, the builds,
    # biome) runs here, with a read-only token and no OIDC token. What it hands on (tarballs
    # and the release commit) is checked by the publish job before anything is pushed.
    #
    # Two legs, each on its own fresh runner, run these same steps (one job definition, so the
    # two cannot drift apart) and upload their output under their own name. The publish job
    # publishes from `release`, and refuses unless every tarball it assembles from `release`
    # is byte-identical to the one it assembles from `rebuild` (release.sh compare-builds).
    # Nothing the build job reports is used as the version: the publish job computes it.
    strategy:
      fail-fast: true
      matrix:
        leg: [release, rebuild]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the checkout to the dispatched commit
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), but this run is for ${GITHUB_SHA}."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # With install scripts, as CI installs: the gate certifies CI's result, so the release
      # builds and tests the tree the way CI did. No credential that can write is in this job.
      - run: npm ci

      # ── Quality gate ──
      - name: Typecheck
        # `npm run typecheck` also compiles the F5 type-surface guard
        # (packages/core/tsconfig.type-tests.json) so a broken TrustedClient type
        # can't publish; a bare `tsc -b` would skip the .test-d.ts.
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      # A release that failed to publish after pushing its tag is finished with republish,
      # never abandoned by bumping past it.
      - name: Refuse to bump past a version that is not fully published
        if: ${{ !inputs.republish }}
        run: bash scripts/release.sh assert-published

      # ── Version bump (all packages in lockstep; skipped in republish mode) ──
      # `npm version` sets each package's own version; `release.sh pin-siblings` then sets every
      # lockstep package a manifest depends on to that same version, so each published package
      # requires exactly the siblings it is released with. --no-workspaces-update: run inside a
      # workspace, npm version reinstalls afterwards, and once core is bumped a sibling's pin
      # to the previous version no longer matches the workspace, so npm would install that
      # previous version from the registry into the tree this job builds.
      - name: Bump versions
        id: version
        env:
          BUMP: ${{ inputs.version }}
        run: |
          if [ "$REPUBLISH" = true ]; then
            echo "Republish mode: using the committed versions, no bump"
          else
            for dir in $(bash scripts/release.sh dirs); do
              (cd "packages/${dir}" && npm version "$BUMP" --no-git-tag-version --no-workspaces-update)
            done
            bash scripts/release.sh pin-siblings
          fi
          VERSION=$(bash scripts/release.sh version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Release v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # A new version must be new everywhere: no tag, and not on npm. A version the registry
      # already has but the repository never recorded is a state to investigate, not to skip.
      - name: Refuse a version that is already released
        if: ${{ !inputs.republish }}
        run: bash scripts/release.sh assert-unreleased

      # ── Re-format the package.json files the bump changed (biome) ──
      # npm version produces multi-line keywords/files arrays that fail biome. Only the files the
      # bump changed are formatted: the rest of the tree is the commit CI checked, and CI's lint
      # job refuses a tree that `biome check --write` would change, so formatting the whole tree
      # here could only rewrite files CI accepted (and the tree-to-publish check would then
      # refuse). The repository's own biome, from node_modules/.bin: a missing one fails the
      # step, where npx would fetch whatever package owns the name.
      - name: Format package.json after bump
        if: ${{ !inputs.republish }}
        run: |
          changed=()
          for dir in $(bash scripts/release.sh dirs); do
            file="packages/${dir}/package.json"
            git diff --quiet -- "$file" || changed+=("$file")
          done
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "::error::The bump changed no package.json."
            exit 1
          fi
          ./node_modules/.bin/biome check --write "${changed[@]}"

      # ── Build ──
      - name: Build usertrust
        run: cd packages/core && npx tsc

      - name: Build usertrust-verify
        run: cd packages/verify && npx tsc

      - name: Build usertrust-openclaw
        run: cd packages/openclaw && npx tsc

      - name: Build usertrust-server
        run: cd packages/server && npx tsc -b

      - name: Build usertrust-acs-adapter
        run: cd packages/acs-adapter && npx tsc -b

      # ui ships a bundled front end, so it needs vite as well as tsc.
      - name: Build usertrust-ui
        run: cd packages/ui && npm run build

      # ── Verify builds ──
      - name: Verify dist directories exist
        run: |
          for pkg in $(bash scripts/release.sh dirs); do
            if [ ! -d "packages/${pkg}/dist" ]; then
              echo "::error::packages/${pkg}/dist not found after build"
              exit 1
            fi
            echo "✓ packages/${pkg}/dist exists ($(find "packages/${pkg}/dist" -name '*.js' | wc -l) JS files)"
          done

      # ── Commit and tag the bump, locally ──
      # Before anything is packed, so that the tag names exactly the tree in the tarballs. It
      # is never pushed from here: this job cannot push. The publish job verifies it and
      # pushes it.
      - name: Commit and tag (local)
        if: ${{ !inputs.republish }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in $(bash scripts/release.sh dirs); do
            git add "packages/${dir}/package.json"
          done
          git commit -s -m "release: v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"

      # What npm packs comes from packages/. Nothing there may differ from the commit the tag
      # names (build output is gitignored), or the registry would carry a tree the repository
      # never recorded.
      - name: The tree to publish is the tree committed
        run: |
          dirty=$(git status --porcelain --untracked-files=all -- packages/)
          if [ -n "$dirty" ]; then
            echo "::error::packages/ differs from $(git rev-parse --short HEAD):"
            echo "$dirty"
            exit 1
          fi

      # The packed packages, which the publish job reads only as data (it publishes tarballs it
      # assembles itself), and, for a new release, the release commit and tag as a git bundle on
      # top of the dispatched commit.
      - name: Pack the packages and the release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="${RUNNER_TEMP}/release"
          bash scripts/release.sh pack "$out"
          if [ "$REPUBLISH" != true ]; then
            git bundle create "${out}/release.bundle" "refs/tags/v${VERSION}" "^${GITHUB_SHA}"
          fi
          ls -l "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.leg }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The approval gate. Its protection (required reviewers, which refs may deploy to it) is
    # a repository setting the owner configures; ci-gate refuses to release until it has a
    # required reviewer. If NPM_TOKEN is moved into it as an environment secret, only this
    # job can read the token. See "Owner setup" in docs/releasing.md.
    environment: npm-publish
    # `id-token: write` cannot be scoped to one step, so this job runs only the runner's own
    # tools (git, gh, jq, python3, node, the npm bundled with node) and GitHub's actions: no
    # `npm ci`, no install, pack, build, test or cache, no dependency code.
    #
    # Everything from the build job (the bundle, the commit in it, both legs' tarballs) is
    # untrusted DATA, never code or config. The working tree stays at the
    # dispatched commit, so every script this job runs is the dispatched commit's; the release
    # commit is never checked out, and its files are read as git blobs (mode 100644 only),
    # never require()d. A build tarball is never published or shown to npm: it is parsed as
    # data, and npm publishes a tarball assembled from the release commit's root files and the
    # build's checked dist/ bytes. See scripts/release.sh and scripts/release-tarball.py.
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      # No credential is persisted: the token reaches git only inside the push step.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the checkout to the dispatched commit
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), but this run is for ${GITHUB_SHA}."
            exit 1
          fi

      # No registry-url: npm's config for the publish is written by scripts/release.sh.
      # Node 24, for the npm it bundles (11.5.1 or later): npm trusted publishing needs it, and
      # npm's own refusal to apply latest implicitly to a lower version is the backstop for the
      # dist-tag check. Pinned exactly:
      # docs/releasing.md cites npm's source as read at the npm this Node bundles, and names
      # this version (the release-workflow test keeps the two equal). This job builds nothing;
      # the build job (Node 22) made every byte it publishes.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false

      # Before anything reads or writes the registry: the npm and Node in use, and that they are
      # at least what npm trusted publishing needs (npm 11.5.1, Node 22.14.0). It fails loudly:
      # below the floor npm would publish with NPM_TOKEN alone, without saying so.
      - name: Require npm 11.5.1 and Node 22.14.0 or later
        run: bash scripts/release.sh assert-npm

      # Again, now: an approval can come hours after ci-gate ran, and CI can be re-run.
      - name: Require CI success on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh gate

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      - uses: actions/download-artifact@v8
        with:
          name: rebuild
          path: ${{ runner.temp }}/rebuild

      # The release commit was made in the build job, which ran dependency code. Push it only
      # if it is exactly a version bump on top of the dispatched commit: one parent, that
      # parent is this run's commit, it changes exactly the six package.json files, each a
      # regular file and nothing but its "version" field and its lockstep siblings' specs, set
      # to exactly that version, and the tag points at it. Nothing is checked out: the commit
      # is read as git objects. That version is computed here, from the dispatched commit's
      # committed version and the `version` input, never taken from the build job. A
      # republish publishes the dispatched commit itself, which the gate has verified.
      - name: Select and verify what to publish
        id: source
        env:
          BUMP: ${{ inputs.version }}
        run: |
          if [ "$REPUBLISH" = true ]; then
            commit=$(git rev-parse HEAD)
          else
            expected=$(bash scripts/release.sh expected-version "$BUMP")
            echo "Expected version: ${expected}"
            commit=$(bash scripts/release.sh verify-release "${RUNNER_TEMP}/release/release.bundle" "$expected")
          fi
          version=$(bash scripts/release.sh version-at "$commit")
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The rebuild check, in every mode: each package's publish tarball, assembled from the
      # release commit with the `release` leg's dist/ bytes, must be byte-identical to the one
      # assembled with the `rebuild` leg's, which a second runner built from the same commit
      # and bump. Both legs' tarballs are read as data.
      - name: Require the rebuild to match, tarball by tarball
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: bash scripts/release.sh compare-builds "${RUNNER_TEMP}/release" "${RUNNER_TEMP}/rebuild" "$COMMIT"

      # The exact publish command with --dry-run; it uploads nothing. First it assembles and
      # verifies every package's tarball: root files from the release commit's blobs, dist/
      # bytes from the build tarball read as data. In a real release it is the last check
      # before anything leaves.
      - name: Publish packages (dry run)
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
        run: bash scripts/release.sh publish "${RUNNER_TEMP}/release" "$COMMIT" --dry-run

      # The token this job will publish with, proven BEFORE anything is pushed: npm whoami must
      # answer, and the token's user must be a read-write collaborator on all six packages. It
      # only reads. A dead NPM_TOKEN would otherwise fail the publish step (E404) after the push,
      # leaving the repository with a version the registry lacks. It runs in every mode, a dry
      # run included: a dry-run dispatch is how to learn the token works without touching master.
      # NPM_TOKEN is in this step and in Publish packages, and in no other.
      - name: Prove the npm token before anything is pushed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The repository variable NPM_PUBLISH_AUTH: unset or "token" proves the token; "oidc" is
          # for a repository that has deleted NPM_TOKEN (docs/releasing.md) and skips the check.
          NPM_PUBLISH_AUTH: ${{ vars.NPM_PUBLISH_AUTH }}
        run: bash scripts/release.sh preflight-token

      # ── Push the release commit and tag ──
      # BEFORE publishing. If the push fails (master moved in either direction since dispatch,
      # or a branch rule refuses it), nothing is published and the release can simply be
      # dispatched again. If
      # publishing then fails, the repository records a version the registry lacks, and
      # republish on the tag finishes it with the same tree. The opposite order can leave the
      # registry with a version the repository never recorded, and npm versions cannot be
      # reused. `--atomic`: the commit and the tag land together or not at all.
      # `--force-with-lease=refs/heads/master:<dispatched commit>`: the push goes through only
      # while master is still the commit this run was dispatched on (GITHUB_SHA, which the
      # checkout was pinned to and the release commit's parent is). Without it, a master reset
      # BACKWARDS during the approval wait (to retract a commit) would make the release commit a
      # fast-forward again, and the push would restore what was retracted. The release commit's
      # parent is that commit, so the push is still a fast-forward: nothing is overwritten.
      # The token is handed to this one git process through the environment (GIT_CONFIG_*),
      # so it is never written to .git/config or any other file a later step could read.
      # The tag is annotated here, on the verified commit, with an early major's reason, so a
      # republish after a failed publish still has it for the GitHub Release.
      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run && !inputs.republish }}
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.source.outputs.version }}
          ALLOW_EARLY_MAJOR: ${{ inputs.allow_early_major }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release.sh tag-release "$VERSION" "$COMMIT"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git push --atomic "--force-with-lease=refs/heads/master:${GITHUB_SHA}" origin "${COMMIT}:refs/heads/master" "refs/tags/v${VERSION}"

      # ── Publish with provenance ──
      # Assembles the six tarballs again (the same commit gives the same bytes) and publishes
      # them. A republish skips a version npm already holds byte-for-byte (finishing a partial
      # publish); a new release refuses one already there, as the dry run did before the push.
      # Any other failure (auth, network, provenance) FAILS the job. A dead
      # NPM_TOKEN previously surfaced as E404 and was swallowed by a blanket `|| echo
      # warning`: never tolerate errors you haven't identified.
      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/release.sh publish "${RUNNER_TEMP}/release" "$COMMIT"

      # ── GitHub Release ──
      # A republish creates it only if the failed run never got this far. Latest is always an
      # explicit decision (gh's default would make it Latest): only the newest semver release,
      # by the v* tags on master and every package's versions on npm (the check that chose the npm
      # dist-tag), so finishing an older version never takes Latest from a newer one.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          if [ "$REPUBLISH" = true ] && gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists."
            exit 0
          fi
          latest=$(bash scripts/release.sh latest-flag "$VERSION")
          echo "Latest: ${latest}"
          # An early major's reason leads the notes. It is read from the tag on origin, which the
          # push step annotated, so a republish (which refuses allow_early_major) keeps it.
          git fetch --quiet --no-tags --force origin "+refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          note=$(bash scripts/release.sh release-note "$VERSION")
          notes=()
          if [ -n "$note" ]; then
            notes=(--notes "$note")
          fi
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes \
            "${notes[@]}" \
            "--latest=${latest}"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          {
            echo "### Dry run: nothing pushed, published or released"
            echo "Ran \`npm publish --dry-run\` for:"
            for name in $(bash scripts/release.sh names); do
              echo "- ${name}@${VERSION}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
