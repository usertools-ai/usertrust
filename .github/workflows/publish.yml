name: Release

# How a release runs, its three modes, how to recover a failed one, and the repository
# settings it relies on: docs/releasing.md. The shell logic lives in scripts/release.sh;
# packages/core/tests/harden/release-workflow.test.ts pins both.
#
# Three jobs, so that dependency code never runs next to a credential that can write:
#   ci-gate  CI passed on the commit, and the npm-publish environment requires a reviewer.
#   build    installs, typechecks, tests, bumps, builds and packs. Read-only token, no OIDC.
#   publish  approval, then pushes and publishes the packed tarballs. Holds the write token,
#            the OIDC token and NPM_TOKEN; installs nothing and runs no dependency code.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run: every step up to `npm publish --dry-run`; nothing is pushed, published or released"
        required: false
        default: false
        type: boolean
      republish:
        description: "Republish: finish a tagged release whose publish failed (dispatch on the tag v<version>). No bump, commit or tag"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

# Every job states its own permissions.
permissions: {}

defaults:
  run:
    shell: bash

env:
  # The CI jobs (.github/workflows/ci.yml, as they are named on a push to master) that must
  # all have concluded `success` on the commit being released. To change it, edit this list
  # in the same pull request that adds, renames or removes a job in ci.yml; the
  # release-workflow test fails until the two agree.
  REQUIRED_CI_JOBS: >-
    agent-config
    lint
    typecheck
    test
    openclaw-contract
    tb-integration
    site-build
  REPUBLISH: ${{ inputs.republish }}

jobs:
  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the CI run's jobs, and the environment's protection rules.
      actions: read
    steps:
      - name: Ensure a releasable ref
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/master) ;;
            refs/tags/v*)
              if [ "$REPUBLISH" != true ]; then
                echo "::error::A tag ref is only for republish. Dispatch a new release on master."
                exit 1
              fi
              ;;
            *)
              echo "::error::Releases run on master (or, to republish, on a release tag), not on ${REF}."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require CI success on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), but this run is for ${GITHUB_SHA}."
            exit 1
          fi
          bash scripts/release.sh gate

      # The approval gate is a repository setting. Until the owner has given the environment
      # a required reviewer, every release (dry runs included) is refused here.
      - name: Require an approval on the npm-publish environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh assert-protected npm-publish

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    # Everything that runs dependency code (install scripts, typecheck, tests, the builds,
    # biome) runs here, with a read-only token and no OIDC token. What it hands on (tarballs
    # and the release commit) is checked by the publish job before anything is pushed.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the checkout to the dispatched commit
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), but this run is for ${GITHUB_SHA}."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # With install scripts, as CI installs: the gate certifies CI's result, so the release
      # builds and tests the tree the way CI did. No credential that can write is in this job.
      - run: npm ci

      # ── Quality gate ──
      - name: Typecheck
        # `npm run typecheck` also compiles the F5 type-surface guard
        # (packages/core/tsconfig.type-tests.json) so a broken TrustedClient type
        # can't publish; a bare `tsc -b` would skip the .test-d.ts.
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      # A release that failed to publish after pushing its tag is finished with republish,
      # never abandoned by bumping past it.
      - name: Refuse to bump past a version that is not fully published
        if: ${{ !inputs.republish }}
        run: bash scripts/release.sh assert-published

      # ── Version bump (all packages in lockstep; skipped in republish mode) ──
      - name: Bump versions
        id: version
        env:
          BUMP: ${{ inputs.version }}
        run: |
          if [ "$REPUBLISH" = true ]; then
            echo "Republish mode: using the committed versions, no bump"
          else
            for dir in $(bash scripts/release.sh dirs); do
              (cd "packages/${dir}" && npm version "$BUMP" --no-git-tag-version)
            done
          fi
          VERSION=$(bash scripts/release.sh version)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Release v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # A new version must be new everywhere: no tag, and not on npm. A version the registry
      # already has but the repository never recorded is a state to investigate, not to skip.
      - name: Refuse a version that is already released
        if: ${{ !inputs.republish }}
        run: bash scripts/release.sh assert-unreleased

      # ── Re-format package.json after bump (biome) ──
      # npm version produces multi-line keywords/files arrays that fail biome.
      # Auto-format so master stays lint-clean after release.
      - name: Format package.json after bump
        if: ${{ !inputs.republish }}
        run: npx biome check . --write

      # ── Build ──
      - name: Build usertrust
        run: cd packages/core && npx tsc

      - name: Build usertrust-verify
        run: cd packages/verify && npx tsc

      - name: Build usertrust-openclaw
        run: cd packages/openclaw && npx tsc

      - name: Build usertrust-server
        run: cd packages/server && npx tsc -b

      - name: Build usertrust-acs-adapter
        run: cd packages/acs-adapter && npx tsc -b

      # ui ships a bundled front end, so it needs vite as well as tsc.
      - name: Build usertrust-ui
        run: cd packages/ui && npm run build

      # ── Verify builds ──
      - name: Verify dist directories exist
        run: |
          for pkg in $(bash scripts/release.sh dirs); do
            if [ ! -d "packages/${pkg}/dist" ]; then
              echo "::error::packages/${pkg}/dist not found after build"
              exit 1
            fi
            echo "✓ packages/${pkg}/dist exists ($(find "packages/${pkg}/dist" -name '*.js' | wc -l) JS files)"
          done

      # ── Commit and tag the bump, locally ──
      # Before anything is packed, so that the tag names exactly the tree in the tarballs. It
      # is never pushed from here: this job cannot push. The publish job verifies it and
      # pushes it.
      - name: Commit and tag (local)
        if: ${{ !inputs.republish }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for dir in $(bash scripts/release.sh dirs); do
            git add "packages/${dir}/package.json"
          done
          git commit -m "release: v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"

      # What npm packs comes from packages/. Nothing there may differ from the commit the tag
      # names (build output is gitignored), or the registry would carry a tree the repository
      # never recorded.
      - name: The tree to publish is the tree committed
        run: |
          dirty=$(git status --porcelain --untracked-files=all -- packages/)
          if [ -n "$dirty" ]; then
            echo "::error::packages/ differs from $(git rev-parse --short HEAD):"
            echo "$dirty"
            exit 1
          fi

      # The tarballs npm will publish, and (for a new release) the release commit and tag as a
      # git bundle on top of the dispatched commit.
      - name: Pack the packages and the release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="${RUNNER_TEMP}/release"
          bash scripts/release.sh pack "$out"
          if [ "$REPUBLISH" != true ]; then
            git bundle create "${out}/release.bundle" "refs/tags/v${VERSION}" "^${GITHUB_SHA}"
          fi
          ls -l "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The approval gate. Its protection (required reviewers, which refs may deploy to it) is
    # a repository setting the owner configures; ci-gate refuses to release until it has a
    # required reviewer. If NPM_TOKEN is moved into it as an environment secret, only this
    # job can read the token. See "Owner setup" in docs/releasing.md.
    environment: npm-publish
    # `id-token: write` cannot be scoped to one step, so this job runs only the runner's own
    # tools (git, gh, node, the npm bundled with node) and GitHub's actions: no `npm ci`, no
    # build, no test, no dependency code. `npm publish` of a tarball runs no lifecycle script.
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      # No credential is persisted: the token reaches git only inside the push step.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the checkout to the dispatched commit
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), but this run is for ${GITHUB_SHA}."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Again, now: an approval can come hours after ci-gate ran, and CI can be re-run.
      - name: Require CI success on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release.sh gate

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/release

      # The release commit was made in the build job, which ran dependency code. Push it only
      # if it is exactly a version bump on top of the dispatched commit: one parent, that
      # parent is this run's commit, it changes nothing but the six "version" fields, the tag
      # points at it, and its version is the one the build job reported.
      - name: Check out and verify the release commit
        if: ${{ !inputs.republish }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          trusted="${RUNNER_TEMP}/release.sh"
          cp scripts/release.sh "$trusted"
          bundle="${RUNNER_TEMP}/release/release.bundle"
          git bundle verify "$bundle"
          git fetch --no-tags "$bundle" "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          git checkout --detach "refs/tags/v${VERSION}^{commit}"
          parent=$(bash "$trusted" release-parent)
          if [ "$parent" != "$GITHUB_SHA" ]; then
            echo "::error::The release commit's parent is ${parent}, not ${GITHUB_SHA}."
            exit 1
          fi
          if [ "$(bash "$trusted" version)" != "$VERSION" ]; then
            echo "::error::The release commit is not at version ${VERSION}."
            exit 1
          fi

      # The exact publish command with --dry-run: checks every tarball's name and version,
      # uploads nothing. In a real release it is the last check before anything leaves.
      - name: Publish packages (dry run)
        run: bash scripts/release.sh publish "${RUNNER_TEMP}/release" --dry-run

      # ── Push the release commit and tag ──
      # BEFORE publishing. If the push fails (master moved since dispatch, or a branch rule
      # refuses it), nothing is published and the release can simply be dispatched again. If
      # publishing then fails, the repository records a version the registry lacks, and
      # republish on the tag finishes it with the same tree. The opposite order can leave the
      # registry with a version the repository never recorded, and npm versions cannot be
      # reused. `--atomic`: the commit and the tag land together or not at all.
      # The token is handed to this one git process through the environment (GIT_CONFIG_*),
      # so it is never written to .git/config or any other file a later step could read.
      - name: Push the release commit and tag
        if: ${{ !inputs.dry_run && !inputs.republish }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::${auth}"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git push --atomic origin "HEAD:refs/heads/master" "refs/tags/v${VERSION}"

      # ── Publish with provenance ──
      # Skips a version that is genuinely already on the registry (a republish finishing a
      # partial publish); any other failure (auth, network, provenance) FAILS the job. A dead
      # NPM_TOKEN previously surfaced as E404 and was swallowed by a blanket `|| echo
      # warning`: never tolerate errors you haven't identified.
      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash scripts/release.sh publish "${RUNNER_TEMP}/release"

      # ── GitHub Release ──
      # A republish creates it only if the failed run never got this far. Latest is always an
      # explicit decision (gh's default would make it Latest): only the newest semver release
      # among the v* tags, so finishing an older version never takes Latest from a newer one.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$REPUBLISH" = true ] && gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists."
            exit 0
          fi
          latest=$(bash scripts/release.sh latest-flag "$VERSION")
          echo "Latest: ${latest}"
          gh release create "v${VERSION}" \
            --verify-tag \
            --title "v${VERSION}" \
            --generate-notes \
            "--latest=${latest}"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### Dry run: nothing pushed, published or released"
            echo "Ran \`npm publish --dry-run\` for:"
            for dir in $(bash scripts/release.sh dirs); do
              echo "- $(node -p "require('./packages/${dir}/package.json').name")@${VERSION}"
            done
          } >> "$GITHUB_STEP_SUMMARY"
