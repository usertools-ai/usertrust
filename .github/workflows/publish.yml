name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry run (skip npm publish)"
        required: false
        default: false
        type: boolean
      republish:
        description: "Republish committed versions (skip bump/tag/release — for recovering a failed publish)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # ── Validate branch ──
      - name: Ensure release from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases must be triggered from the master branch."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # ── Quality gate ──
      - name: Typecheck
        # `npm run typecheck` also compiles the F5 type-surface guard
        # (packages/core/tsconfig.type-tests.json) so a broken TrustedClient type
        # can't publish; a bare `tsc -b` would skip the .test-d.ts.
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      # ── Version bump (all packages in lockstep; skipped in republish mode) ──
      - name: Bump versions
        id: version
        run: |
          if [ "${{ inputs.republish }}" = "true" ]; then
            echo "Republish mode — using committed versions, no bump"
          else
            cd packages/core && npm version ${{ inputs.version }} --no-git-tag-version && cd ../..
            cd packages/verify && npm version ${{ inputs.version }} --no-git-tag-version && cd ../..
            cd packages/openclaw && npm version ${{ inputs.version }} --no-git-tag-version && cd ../..
            cd packages/server && npm version ${{ inputs.version }} --no-git-tag-version && cd ../..
            cd packages/acs-adapter && npm version ${{ inputs.version }} --no-git-tag-version && cd ../..
          fi
          VERSION=$(node -p 'require("./packages/core/package.json").version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Release v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      # ── Re-format package.json after bump (biome) ──
      # npm version produces multi-line keywords/files arrays that fail biome.
      # Auto-format so master stays lint-clean after release.
      - name: Format package.json after bump
        if: ${{ !inputs.republish }}
        run: npx biome check . --write

      # ── Build ──
      - name: Build usertrust
        run: cd packages/core && npx tsc

      - name: Build usertrust-verify
        run: cd packages/verify && npx tsc

      - name: Build usertrust-openclaw
        run: cd packages/openclaw && npx tsc

      - name: Build usertrust-server
        run: cd packages/server && npx tsc -b

      - name: Build usertrust-acs-adapter
        run: cd packages/acs-adapter && npx tsc -b

      # ── Verify builds ──
      - name: Verify dist directories exist
        run: |
          for pkg in core verify openclaw server acs-adapter; do
            if [ ! -d "packages/${pkg}/dist" ]; then
              echo "::error::packages/${pkg}/dist not found after build"
              exit 1
            fi
            echo "✓ packages/${pkg}/dist exists ($(find packages/${pkg}/dist -name '*.js' | wc -l) JS files)"
          done

      # ── Publish with provenance ──
      # Skips a version that is genuinely already on the registry; any other
      # publish failure (auth, network, provenance) FAILS the job. A dead
      # NPM_TOKEN previously surfaced as E404 and was swallowed by a blanket
      # `|| echo warning` — never tolerate errors you haven't identified.
      - name: Publish packages
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for entry in core:usertrust verify:usertrust-verify openclaw:usertrust-openclaw server:usertrust-server acs-adapter:usertrust-acs-adapter; do
            dir="${entry%%:*}"; pkg="${entry##*:}"
            version=$(node -p "require('./packages/${dir}/package.json').version")
            if [ -n "$(npm view "${pkg}@${version}" version 2>/dev/null || true)" ]; then
              echo "::notice::${pkg}@${version} already on npm — skipping"
            else
              echo "Publishing ${pkg}@${version}"
              (cd "packages/${dir}" && npm publish --access public --provenance)
            fi
          done

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "### Dry run — skipped npm publish" >> "$GITHUB_STEP_SUMMARY"
          echo "Would have published:" >> "$GITHUB_STEP_SUMMARY"
          echo "- usertrust@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- usertrust-verify@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- usertrust-openclaw@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- usertrust-server@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- usertrust-acs-adapter@${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

      # ── Tag + commit version bump ──
      - name: Commit and tag
        if: ${{ !inputs.dry_run && !inputs.republish }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/*/package.json
          git commit -m "release: v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin master --follow-tags

      # ── GitHub Release ──
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && !inputs.republish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest
