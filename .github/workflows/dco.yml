name: DCO
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dco:
    # Same-repo branches and pushes run on Blacksmith; a FORK pull request stays on a
    # GitHub-hosted runner (fork workflows still need maintainer approval per repo policy).
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'blacksmith-4vcpu-ubuntu-2204' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        uses: gsactions/commit-message-checker@v2
        with:
          pattern: 'Signed-off-by: .+ <.+>'
          error: |
            All commits must include a DCO sign-off line:
              Signed-off-by: Your Name <your@email.com>

            Add it with: git commit -s --amend
            See CONTRIBUTING.md for details.
          excludeTitle: true
          excludeDescription: true
          checkAllCommitMessages: true
          accessToken: ${{ secrets.GITHUB_TOKEN }}
